version: '3.2'
services:
    store:
        image: redis
        networks:
            - backend
    db:
        image: postgres
        volumes:
            - db_data:/var/lib/postgresql
        networks:
            - backend
        environment:
            - POSTGRES_HOST_AUTH_METHOD=trust
    worker:
        build: worker
        networks:
            - backend
        volumes:
            - cctf:/cctf
            - args_store:/args_store
            - ./pack:/pack_external
            - /var/run/docker.sock:/var/run/docker.sock
        depends_on:
            store:
                condition: service_started
            db:
                condition: service_started
            web:
                condition: service_healthy
                restart: true
        environment:
            - REDIS_HOST=store
            - POSTGRES_HOST=db
    web:
        build: web
        ports:
            - "5000:5000"
        networks:
            - backend
        volumes:
            - cctf:/cctf
            - ./pack:/pack_external
        depends_on:
            - store
            - db
        environment:
            - REDIS_HOST=store
            - POSTGRES_HOST=db
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:5000"]
            interval: 10s
            timeout: 1s
            retries: 5
networks:
    backend:

volumes:
    cctf:
    db_data:
    args_store:
